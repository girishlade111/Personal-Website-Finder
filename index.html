<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girish Bookmarks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #404040;
            --shadow: rgba(0, 0, 0, 0.3);
            --modal-backdrop: rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.1);
            --modal-backdrop: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                linear-gradient(-45deg, 
                    rgba(10, 10, 10, 0.8), 
                    rgba(26, 26, 26, 0.7), 
                    rgba(10, 10, 10, 0.8), 
                    rgba(26, 26, 26, 0.7)
                ),
                url('image.jpeg');
            background-size: 400% 400%, cover;
            background-position: center center, center center;
            background-repeat: no-repeat, no-repeat;
            animation: gradientShift 15s ease infinite;
        }

        [data-theme="light"] .animated-bg {
            background: 
                linear-gradient(-45deg, 
                    rgba(255, 255, 255, 0.9), 
                    rgba(248, 250, 252, 0.8), 
                    rgba(255, 255, 255, 0.9), 
                    rgba(248, 250, 252, 0.8)
                ),
                url('image.jpeg');
            background-size: 400% 400%, cover;
            background-position: center center, center center;
            background-repeat: no-repeat, no-repeat;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Sparkles Effect */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: sparkleAnimation 3s infinite;
        }

        @keyframes sparkleAnimation {

            0%,
            100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Main Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .theme-toggle:hover {
            background: var(--accent);
            transform: scale(1.15) translateY(-2px);
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                0 0 0 1px rgba(59, 130, 246, 0.1);
        }

        .theme-toggle:active {
            transform: scale(1.05) translateY(0);
        }

        /* Search */
        .search-container {
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .search-input-wrapper {
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 
                0 0 0 3px rgba(59, 130, 246, 0.1),
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        .search-input:hover {
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .categories-wrapper {
            min-width: 200px;
        }

        .categories-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .categories-select {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1rem;
            padding-right: 3rem;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .categories-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 
                0 0 0 3px rgba(59, 130, 246, 0.1),
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        .categories-select:hover {
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .categories-select option {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 0.5rem;
        }

        [data-theme="light"] .categories-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        }

        .active-category {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .category-remove {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .category-remove:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                0 0 0 1px rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
        }

        .card:hover::before {
            left: 100%;
        }

        [data-theme="light"] .card {
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] .card:hover {
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.15),
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                0 0 0 1px rgba(59, 130, 246, 0.2);
        }

        .card-category {
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .card-website {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .card-notes {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .card-open-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .card-open-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .card-open-btn:active {
            transform: translateY(0);
        }

        .card-open-btn svg {
            width: 14px;
            height: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px var(--shadow);
            display: flex;
            flex-direction: column;
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            margin: 2rem 0;
        }

        .load-more-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }

        .load-more-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .load-more-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                0 0 0 1px rgba(59, 130, 246, 0.1);
        }

        .load-more-btn:hover::before {
            left: 100%;
        }

        .load-more-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-backdrop);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.show {
            display: flex;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .modal-field {
            margin-bottom: 1.5rem;
        }

        .modal-label {
            display: block;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-value {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-all;
        }

        /* Footer */
        .footer {
            margin-top: 4rem;
            padding: 2rem 0;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .social-link:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-4px) scale(1.1);
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                0 0 0 1px rgba(59, 130, 246, 0.1);
        }

        .social-link:active {
            transform: translateY(-2px) scale(1.05);
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 2rem;
            }

            .search-container {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .categories-wrapper {
                min-width: unset;
                width: 100%;
            }

            .active-category {
                margin-top: 0.5rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .modal-content {
                margin: 1rem;
                padding: 1.5rem;
            }

            .social-links {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>
    <div class="sparkles-container" id="sparkles"></div>

    <div class="container">
        <header class="header">
            <h1>Girish Bookmarks</h1>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </header>

        <div class="search-container">
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by category or website...">
            </div>
            <div class="categories-wrapper">
                <label class="categories-label">Categories</label>
                <select class="categories-select" id="categoriesSelect">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>
        <div class="active-category" id="activeCategory"></div>

        <div class="cards-grid" id="cardContainer">
            <div class="loading">Loading website data...</div>
        </div>

        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">
                Load More
            </button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="social-links">
            <a href="https://www.instagram.com/girish_lade_/" class="social-link" target="_blank" title="Instagram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path

    <script>
        // Global variables
        let allData = [];
        let displayedData = [];
        let currentIndex = 0;
        const itemsPerPage = 6;
        let isSearching = false;

        // DOM elements
        const cardContainer = document.getElementById('cardContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchInput = document.getElementById('searchInput');
        const categoriesSelect = document.getElementById('categoriesSelect');
        const activeCategory = document.getElementById('activeCategory');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modalClose');
        const modalBody = document.getElementById('modalBody');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Categories state
        let selectedCategory = '';
        let availableCategories = [];

        // Initialize app
        document.addEventListener('DOMContentLoaded', function () {
            initializeTheme();
            createSparkles();
            loadData();
            setupEventListeners();
        });

        // Theme management
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // Sparkles effect
        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            const sparkleCount = 20;

            for (let i = 0; i < sparkleCount; i++) {
                createSparkle(sparklesContainer);
            }
        }

        function createSparkle(container) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';

            // Random position
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';

            // Random animation delay
            sparkle.style.animationDelay = Math.random() * 3 + 's';

            container.appendChild(sparkle);

            // Recreate sparkle after animation
            setTimeout(() => {
                sparkle.remove();
                createSparkle(container);
            }, 3000 + Math.random() * 2000);
        }

        // Data loading
        function loadData() {
            // Check if we're running in Google Apps Script environment
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                // Real Google Apps Script call
                google.script.run
                    .withSuccessHandler(handleDataLoad)
                    .withFailureHandler(handleDataError)
                    .getSheetData();
            } else {
                // Fallback: Load data directly from Google Sheets API
                loadDataFromSheetsAPI();
            }
        }

        // Load data using Google Sheets API (for standalone HTML file)
        function loadDataFromSheetsAPI() {
            const SHEET_ID = '14a6avVEnvrj0f0h0igzdfq_t_socePSjneLvxAHU3y8';
            const API_KEY = 'AIzaSyCl9iFfxfVzJ-LXqgtwGCzSBnHus-1xWTA';

            // Try different sheet names and ranges
            const possibleRanges = [
                'WebsiteData!A:F',
                'Sheet1!A:F',
                'A:F'  // Default range without sheet name
            ];

            tryLoadFromRange(0);

            function tryLoadFromRange(rangeIndex) {
                if (rangeIndex >= possibleRanges.length) {
                    handleDataError('Unable to find data in any sheet. Please check your sheet structure.');
                    return;
                }

                const RANGE = possibleRanges[rangeIndex];
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;

                console.log(`Trying range: ${RANGE}`);

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        console.log('API Response:', data);

                        if (data.error) {
                            console.error('API Error:', data.error);
                            if (rangeIndex < possibleRanges.length - 1) {
                                tryLoadFromRange(rangeIndex + 1);
                            } else {
                                handleDataError(`API Error: ${data.error.message}`);
                            }
                            return;
                        }

                        if (data.values && data.values.length > 0) {
                            console.log('Raw data:', data.values);

                            if (data.values.length === 1) {
                                handleDataError('Sheet only contains headers, no data rows found.');
                                return;
                            }

                            const headers = data.values[0];
                            const rows = data.values.slice(1);

                            console.log('Headers:', headers);
                            console.log('Data rows:', rows.length);

                            const formattedData = rows.map((row, rowIndex) => {
                                const item = {};
                                headers.forEach((header, index) => {
                                    item[header] = row[index] || '';
                                });
                                console.log(`Row ${rowIndex + 1}:`, item);
                                return item;
                            }).filter(item => {
                                // More flexible filtering - check if any meaningful data exists
                                const hasWebsite = item.Website && item.Website.trim() !== '';
                                const hasCategory = item.Category && item.Category.trim() !== '';
                                return hasWebsite || hasCategory;
                            });

                            console.log('Formatted data:', formattedData);

                            if (formattedData.length > 0) {
                                handleDataLoad(formattedData);
                            } else {
                                handleDataError('No valid data rows found. Please check your sheet content.');
                            }
                        } else {
                            if (rangeIndex < possibleRanges.length - 1) {
                                tryLoadFromRange(rangeIndex + 1);
                            } else {
                                handleDataError('No data found in the sheet');
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error loading data from Sheets API:', error);
                        if (rangeIndex < possibleRanges.length - 1) {
                            tryLoadFromRange(rangeIndex + 1);
                        } else {
                            handleDataError(`Network error: ${error.message}`);
                        }
                    });
            }
        }

        // Handle data loading errors
        function handleDataError(error) {
            console.error('Data loading error:', error);
            cardContainer.innerHTML = `
                <div class="loading" style="color: var(--text-secondary);">
                    <p>Unable to load data from Google Sheet.</p>
                    <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                        Please check your sheet permissions and API configuration.
                    </p>
                    <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                        Error: ${error}
                    </p>
                </div>
            `;
        }

        function handleDataLoad(data) {
            allData = data;
            displayedData = [...allData];
            currentIndex = 0;

            // Populate categories dropdown
            populateCategories();
            renderCards();
        }

        // Populate categories dropdown
        function populateCategories() {
            const categories = new Set();
            allData.forEach(item => {
                if (item.Category && item.Category.trim() !== '') {
                    categories.add(item.Category.trim());
                }
            });

            availableCategories = Array.from(categories).sort();

            // Clear existing options (except "All Categories")
            categoriesSelect.innerHTML = '<option value="">All Categories</option>';

            // Add category options
            availableCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoriesSelect.appendChild(option);
            });
        }

        // Card rendering
        function renderCards() {
            if (displayedData.length === 0) {
                cardContainer.innerHTML = '<div class="loading">No websites found matching your search.</div>';
                loadMoreBtn.style.display = 'none';
                return;
            }

            const cardsToShow = displayedData.slice(0, currentIndex + itemsPerPage);
            cardContainer.innerHTML = '';

            cardsToShow.forEach((item, index) => {
                const card = createCard(item, index);
                cardContainer.appendChild(card);
            });

            currentIndex += itemsPerPage;

            // Show/hide load more button
            if (currentIndex >= displayedData.length || isSearching) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'block';
            }
        }

        function createCard(item, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = index;

            // Function to format URL
            const formatUrl = (url) => {
                if (!url || url.trim() === '') return null;
                url = url.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    return 'https://' + url;
                }
                return url;
            };

            const websiteUrl = formatUrl(item.Website);

            card.innerHTML = `
                <div class="card-category">${item.Category}</div>
                <div class="card-website">${item.Website}</div>
                <div class="card-notes">${item.Notes || 'No notes available'}</div>
                <div class="card-actions">
                    ${websiteUrl ? `
                        <button class="card-open-btn" onclick="openWebsite('${websiteUrl}')" title="Open ${item.Website}">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M14,3V5H17.59L7.76,14.83L9.17,16.24L19,6.41V10H21V3M19,19H5V5H12V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19Z" />
                            </svg>
                            Open Link
                        </button>
                    ` : ''}
                </div>
            `;

            return card;
        }

        // Function to open website in new tab
        function openWebsite(url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        // Search and categories functionality
        function handleSearch() {
            applyFilters();
        }

        function handleCategoryChange() {
            selectedCategory = categoriesSelect.value;
            applyFilters();
            updateActiveCategoryDisplay();
        }

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();

            let filteredData = [...allData];

            // Apply category filter
            if (selectedCategory) {
                filteredData = filteredData.filter(item =>
                    item.Category && item.Category.trim() === selectedCategory
                );
            }

            // Apply search filter
            if (searchTerm) {
                filteredData = filteredData.filter(item =>
                    (item.Category && item.Category.toLowerCase().includes(searchTerm)) ||
                    (item.Website && item.Website.toLowerCase().includes(searchTerm)) ||
                    (item.Notes && item.Notes.toLowerCase().includes(searchTerm))
                );
            }

            displayedData = filteredData;
            isSearching = searchTerm !== '' || selectedCategory !== '';
            currentIndex = 0;
            renderCards();
        }

        function updateActiveCategoryDisplay() {
            activeCategory.innerHTML = '';

            if (selectedCategory) {
                const categoryTag = document.createElement('div');
                categoryTag.className = 'category-tag';
                categoryTag.innerHTML = `
                    Category: ${selectedCategory}
                    <button class="category-remove" onclick="removeCategory()" title="Remove category filter">×</button>
                `;
                activeCategory.appendChild(categoryTag);
            }
        }

        function removeCategory() {
            selectedCategory = '';
            categoriesSelect.value = '';
            applyFilters();
            updateActiveCategoryDisplay();
        }

        // Modal functionality
        function showModal(itemIndex) {
            const item = displayedData[itemIndex];
            if (!item) return;

            modalBody.innerHTML = `
                <div class="modal-field">
                    <label class="modal-label">Category</label>
                    <div class="modal-value">${item.Category}</div>
                </div>
                <div class="modal-field">
                    <label class="modal-label">Website</label>
                    <div class="modal-value">${item.Website}</div>
                </div>
                <div class="modal-field">
                    <label class="modal-label">Username</label>
                    <div class="modal-value">${item.Username}</div>
                </div>
                <div class="modal-field">
                    <label class="modal-label">Password</label>
                    <div class="modal-value">${item.Password}</div>
                </div>
                <div class="modal-field">
                    <label class="modal-label">Notes</label>
                    <div class="modal-value">${item.Notes || 'No notes available'}</div>
                </div>
                <div class="modal-field">
                    <label class="modal-label">Last Updated</label>
                    <div class="modal-value">${item['Last Updated']}</div>
                </div>
            `;

            modal.classList.add('show');
        }

        function hideModal() {
            modal.classList.remove('show');
        }

        // Event listeners
        function setupEventListeners() {
            // Theme toggle
            themeToggle.addEventListener('click', toggleTheme);

            // Search
            searchInput.addEventListener('input', handleSearch);

            // Categories dropdown
            categoriesSelect.addEventListener('change', handleCategoryChange);

            // Load more
            loadMoreBtn.addEventListener('click', renderCards);

            // Card clicks
            cardContainer.addEventListener('click', function (e) {
                // Don't open modal if clicking on the open link button
                if (e.target.closest('.card-open-btn')) {
                    return;
                }

                const card = e.target.closest('.card');
                if (card) {
                    const index = parseInt(card.dataset.index);
                    showModal(index);
                }
            });

            // Modal close
            modalClose.addEventListener('click', hideModal);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) {
                    hideModal();
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    hideModal();
                }
                if (e.key === '/' && !modal.classList.contains('show')) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        // Google Apps Script integration (for real implementation)
        function getSheetData() {
            // This function would be called by Google Apps Script
            // google.script.run.withSuccessHandler(handleDataLoad).getSheetData();
        }
    </script>
